<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHD License - Đăng nhập</title>

    <!-- HỆ THỐNG BẢO VỆ TOÀN DIỆN CHỐNG DEVTOOLS -->
    <script>
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let isTriggered = false;
            let isDialogActive = false;

            const wrapDialog = function(originalFn) {
                return function() {
                    isDialogActive = true;
                    try {
                        return originalFn.apply(this, arguments);
                    } finally {
                        isDialogActive = false;
                    }
                };
            };
            if (typeof window.alert === "function") window.alert = wrapDialog(window.alert);
            if (typeof window.confirm === "function") window.confirm = wrapDialog(window.confirm);
            if (typeof window.prompt === "function") window.prompt = wrapDialog(window.prompt);

            function triggerBlock() {
                if (isTriggered || isDialogActive) return;
                isTriggered = true;

                if (typeof memoryUnlockToken !== "undefined") memoryUnlockToken = null;
                try { sessionStorage.clear(); } catch(e) {}
                try { localStorage.clear(); } catch(e) {}

                try {
                    document.documentElement.innerHTML = "<div style='background:#050505;color:#ef4444;height:100vh;display:flex;justify-content:center;align-items:center;font-family:sans-serif;font-size:22px;text-align:center;'><b>⚠️ CẢNH BÁO: PHÁT HIỆN TRUY CẬP TRÁI PHÉP!<br><span style=\"font-size:15px;color:#94a3b8;font-weight:normal;\">Vui lòng tắt DevTools để truy cập hệ thống.</span></b></div>";
                } catch(e) {}

                try {
                    window.location.replace("about:blank");
                } catch(e) {
                    window.location.href = "about:blank";
                }
                setTimeout(function() {
                    try { window.close(); } catch(e) {}
                    try { window.location.href = "https://www.google.com"; } catch(e) {}
                }, 50);
            }

            function checkWindowSize() {
                if (isMobile || isDialogActive) return;
                const widthDiff = window.outerWidth - window.innerWidth;
                const heightDiff = window.outerHeight - window.innerHeight;
                if (widthDiff > 160 || heightDiff > 160) {
                    triggerBlock();
                }
            }

            function checkDebugger() {
                if (isDialogActive) return;
                const startTime = performance.now();
                (function() { return false; }['constructor']('debugger')['call']());
                const endTime = performance.now();
                if (endTime - startTime > 50) {
                    triggerBlock();
                }
            }

            document.addEventListener("keydown", function(e) {
                const key = (e.key || "").toUpperCase();
                const ctrlOrMeta = e.ctrlKey || e.metaKey;
                const shift = e.shiftKey;

                if (
                    key === "F12" ||
                    (ctrlOrMeta && shift && ["I", "J", "C"].includes(key)) ||
                    (ctrlOrMeta && ["U", "S"].includes(key))
                ) {
                    e.preventDefault();
                    e.stopPropagation();
                    triggerBlock();
                    return false;
                }
            }, true);

            document.addEventListener("contextmenu", function(e) {
                e.preventDefault();
                return false;
            }, true);

            window.addEventListener("resize", checkWindowSize);

            checkWindowSize();
            checkDebugger();

            setInterval(checkWindowSize, 200);
            setInterval(checkDebugger, 250);

            try {
                const noop = function() {};
                console.log = noop; console.warn = noop; console.error = noop;
                console.info = noop; console.debug = noop; console.clear = noop;
                console.table = noop; console.dir = noop; console.trace = noop;
                window.eval = function() { return "Blocked"; };
            } catch(e) {}
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-bottom: 10px; color: #111827; text-align: center; }
        p { color: #6b7280; text-align: center; margin-bottom: 25px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #111827; }
        button {
            width: 100%;
            padding: 14px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #374151; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .error { color: #dc2626; text-align: center; margin-top: 15px; font-size: 13px; min-height: 20px; }
    </style>
</head>
<body>



    <div class="login-box">
        <h2>SHD License Admin</h2>
        <p>Đăng nhập để quản lý hệ thống</p>
        
        <input id="username" type="text" placeholder="Tên đăng nhập" onkeydown="if(event.key==='Enter') login()">
        <input id="password" type="password" placeholder="Mật khẩu" onkeydown="if(event.key==='Enter') login()">
        
        <button id="loginBtn" onclick="login()">Đăng nhập</button>
        <div id="loginError" class="error"></div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errEl = document.getElementById("loginError");
            const btn = document.getElementById("loginBtn");

            if (!username || !password) {
                errEl.textContent = "Vui lòng nhập đủ tài khoản và mật khẩu.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Đang kiểm tra...";
            errEl.textContent = "";

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!data.success) {
                    errEl.textContent = data.message || "Sai tài khoản hoặc mật khẩu.";
                    return;
                }

                sessionStorage.setItem("admin_token", data.token);
                window.location.href = "detail.html";

            } catch (err) {
                errEl.textContent = "Lỗi kết nối server.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Đăng nhập";
            }
        }
    </script>
</body>
</html>
