<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHD License Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .login {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        button {
            border: 0;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            margin: 3px;
        }

        .primary {
            background: #111827;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .warning {
            background: #f59e0b;
            color: white;
        }

        .logout {
            float: right;
            background: #eee;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .number {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .table-box {
            background: white;
            border-radius: 10px;
            overflow: auto;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #fafafa;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .disabled {
            background: #fee2e2;
            color: #991b1b;
        }

        .expired {
            background: #fef3c7;
            color: #92400e;
        }

        #dashboard {
            display: none;
        }

        .toolbar {
            margin-bottom: 20px;
        }

        .error {
            color: #dc2626;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div id="loginPage" class="login">

    <h2>SHD License Admin</h2>

    <p>Đăng nhập quản trị</p>

    <input
        id="username"
        type="text"
        placeholder="Username"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button
        class="primary"
        style="width:100%;"
        onclick="login()"
    >
        Đăng nhập
    </button>

    <div id="loginError" class="error"></div>

</div>


<div id="dashboard">

    <div class="container">

        <button
            class="logout"
            onclick="logout()"
        >
            Đăng xuất
        </button>

        <h1>SHD License Dashboard</h1>

        <div class="subtitle">
            Quản lý License SHD V6
        </div>


        <div class="stats">

            <div class="card">
                Tổng License
                <div id="total" class="number">0</div>
            </div>

            <div class="card">
                Active
                <div id="active" class="number">0</div>
            </div>

            <div class="card">
                Disabled
                <div id="disabled" class="number">0</div>
            </div>

            <div class="card">
                Expired
                <div id="expired" class="number">0</div>
            </div>

        </div>


        <div class="toolbar">

            <button
                class="primary"
                onclick="createLicense()"
            >
                + Tạo License
            </button>

            <button
                onclick="loadLicenses()"
            >
                ↻ Refresh
            </button>

        </div>


        <div class="table-box">

            <table>

                <thead>

                <tr>
                    <th>ID</th>
                    <th>License</th>
                    <th>Status</th>
                    <th>Expires</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody id="licenseTable"></tbody>

            </table>

        </div>

    </div>

</div>


<script src="/admin/admin.js"></script>

</body>
</html>
