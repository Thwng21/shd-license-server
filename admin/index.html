<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHD License - Đăng nhập</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-bottom: 10px; color: #111827; text-align: center; }
        p { color: #6b7280; text-align: center; margin-bottom: 25px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #111827; }
        button {
            width: 100%;
            padding: 14px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #374151; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .error { color: #dc2626; text-align: center; margin-top: 15px; font-size: 13px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>SHD License Admin</h2>
        <p>Đăng nhập để quản lý hệ thống</p>
        
        <input id="username" type="text" placeholder="Tên đăng nhập" onkeydown="if(event.key==='Enter') login()">
        <input id="password" type="password" placeholder="Mật khẩu" onkeydown="if(event.key==='Enter') login()">
        
        <button id="loginBtn" onclick="login()">Đăng nhập</button>
        <div id="loginError" class="error"></div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errEl = document.getElementById("loginError");
            const btn = document.getElementById("loginBtn");

            if (!username || !password) {
                errEl.textContent = "Vui lòng nhập đủ tài khoản và mật khẩu.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Đang kiểm tra...";
            errEl.textContent = "";

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!data.success) {
                    errEl.textContent = data.message || "Sai tài khoản hoặc mật khẩu.";
                    return;
                }

                // Lưu token và chuyển sang trang detail
                sessionStorage.setItem("admin_token", data.token);
                window.location.href = "detail.html";

            } catch (err) {
                errEl.textContent = "Lỗi kết nối server.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Đăng nhập";
            }
        }
    </script>
</body>
</html>
